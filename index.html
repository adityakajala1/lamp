<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMO — Suspended Architectural Pendant</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --transition-time: 0.85s;
      
      /* Dark Theme: Deep Obsidian Charcoal & Gilded Antique Brass */
      --bg-radial: radial-gradient(circle at 50% 46%, #1c1712 0%, #0a0807 58%, #030302 100%);
      --text-pri: #f5eedb;
      --text-sec: rgba(245, 238, 219, 0.5);
      --text-dim: rgba(245, 238, 219, 0.22);
      --badge-bg: rgba(212, 175, 55, 0.08);
      --badge-border: rgba(212, 175, 55, 0.22);
      --badge-text: #e6ca65;
    }

    body.light-mode {
      /* Light Theme: Gallery Alabaster & Brushed Champagne Bronze */
      --bg-radial: radial-gradient(circle at 50% 46%, #ffffff 0%, #f6f3ed 52%, #e5e0d6 100%);
      --text-pri: #1a1714;
      --text-sec: rgba(26, 23, 20, 0.6);
      --text-dim: rgba(26, 23, 20, 0.28);
      --badge-bg: rgba(26, 23, 20, 0.04);
      --badge-border: rgba(26, 23, 20, 0.12);
      --badge-text: #595044;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-radial);
      color: var(--text-pri);
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      transition: background var(--transition-time) ease, color var(--transition-time) ease;
      user-select: none;
      -webkit-user-select: none;
      cursor: default;
    }

    /* Ambient Wall Glow */
    .wall-glow {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 880px;
      height: 880px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 195, 80, 0.24) 0%, rgba(255, 150, 40, 0.08) 38%, transparent 70%);
      pointer-events: none;
      z-index: 2;
      mix-blend-mode: screen;
      opacity: 1;
      transition: opacity var(--transition-time) ease;
    }
    body.light-mode .wall-glow {
      opacity: 0;
    }

    /* Floor Reflection */
    .floor-reflection {
      position: absolute;
      bottom: -60px;
      left: 50%;
      transform: translateX(-50%) rotateX(65deg);
      width: 760px;
      height: 290px;
      border-radius: 50%;
      background: radial-gradient(ellipse at 50% 50%, rgba(255, 210, 110, 0.24) 0%, rgba(255, 160, 40, 0.06) 45%, transparent 70%);
      pointer-events: none;
      z-index: 2;
      mix-blend-mode: screen;
      opacity: 1;
      transition: opacity var(--transition-time) ease;
    }
    body.light-mode .floor-reflection {
      opacity: 0;
    }

    /* Floating Atmospheric Dust Canvas */
    #dust-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 15;
      transition: opacity var(--transition-time) ease;
    }
    body.light-mode #dust-canvas {
      opacity: 0;
    }

    /* Gallery Framing HUD */
    .hud {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 38px 46px;
      pointer-events: none;
      z-index: 25;
    }

    .hud-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .brand-mark {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .brand-title {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      letter-spacing: 0.35em;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--text-pri);
      transition: color var(--transition-time) ease;
    }

    .brand-sub {
      font-size: 0.7rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--text-sec);
      font-weight: 400;
      transition: color var(--transition-time) ease;
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 16px;
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      border-radius: 100px;
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-weight: 500;
      color: var(--badge-text);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: all var(--transition-time) ease;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffb834;
      box-shadow: 0 0 10px #ffb834, 0 0 20px #ffb834;
      transition: background var(--transition-time) ease, box-shadow var(--transition-time) ease;
    }
    body.light-mode .status-dot {
      background: #8b8070;
      box-shadow: none;
    }

    .hud-footer {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      width: 100%;
    }

    .meta-tag {
      font-size: 0.68rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--text-dim);
      font-weight: 400;
      line-height: 1.8;
      transition: color var(--transition-time) ease;
    }

    .interaction-cue {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.7rem;
      letter-spacing: 0.24em;
      text-transform: uppercase;
      color: var(--text-sec);
      font-weight: 500;
      transition: color var(--transition-time) ease;
    }

    .cue-pulse {
      display: inline-block;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: currentColor;
      animation: cueBlink 2.4s infinite ease-in-out;
    }

    @keyframes cueBlink {
      0%, 100% { opacity: 0.25; transform: scale(0.9); }
      50% { opacity: 1; transform: scale(1.4); }
    }

    /* CENTERED FIXTURE STAGE (Prominent, Heroic, Close-up) */
    .fixture-stage {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 480px;
      height: 720px;
      max-height: 94vh;
      z-index: 20;
      cursor: grab;
      -webkit-tap-highlight-color: transparent;
    }
    .fixture-stage:active {
      cursor: grabbing;
    }

    /* Wall Cast Shadow (Synchronized with Pendulum) */
    .fixture-shadow {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 480px;
      height: 720px;
      max-height: 94vh;
      opacity: 0.55;
      filter: blur(28px);
      pointer-events: none;
      z-index: 5;
      transition: opacity var(--transition-time) ease;
    }
    body.light-mode .fixture-shadow {
      opacity: 0.16;
      filter: blur(22px);
    }

    /* Main SVG Canvas */
    .fixture-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 20px 38px rgba(0, 0, 0, 0.48));
      transition: filter var(--transition-time) ease;
    }
    body.light-mode .fixture-svg {
      filter: drop-shadow(0 18px 28px rgba(0, 0, 0, 0.14));
    }

    /* Synchronized Volumetric Light Cone */
    .light-cone {
      position: absolute;
      top: 125px; /* exactly at pivot point height: 720 * (52 / 300) = 125px */
      left: 50%;
      width: 580px;
      height: 640px;
      margin-left: -290px;
      transform-origin: 290px 0px; /* pivots at top center */
      background: linear-gradient(to bottom, 
        transparent 195px, 
        rgba(255, 225, 120, 0.58) 205px, 
        rgba(255, 180, 50, 0.20) 330px, 
        rgba(255, 140, 20, 0.04) 500px, 
        transparent 100%
      );
      -webkit-mask-image: conic-gradient(
        from 148deg at 50% 205px, 
        transparent 0deg, 
        rgba(0,0,0,0.15) 12deg, 
        rgba(0,0,0,1) 28deg, 
        rgba(0,0,0,1) 64deg, 
        rgba(0,0,0,0.15) 80deg, 
        transparent 92deg
      );
      mask-image: conic-gradient(
        from 148deg at 50% 205px, 
        transparent 0deg, 
        rgba(0,0,0,0.15) 12deg, 
        rgba(0,0,0,1) 28deg, 
        rgba(0,0,0,1) 64deg, 
        rgba(0,0,0,0.15) 80deg, 
        transparent 92deg
      );
      pointer-events: none;
      mix-blend-mode: screen;
      z-index: 12;
      opacity: 1;
      transition: opacity var(--transition-time) cubic-bezier(0.4, 0, 0.2, 1);
    }
    body.light-mode .light-cone {
      opacity: 0;
    }

    /* Filament Incandescent Glow */
    .filament-core {
      transition: filter 0.5s ease, fill 0.5s ease, opacity 0.5s ease;
    }
    body.light-mode .filament-core {
      fill: #8b8070;
      filter: none;
      opacity: 0.35;
    }

    .bulb-envelope {
      transition: fill 0.8s ease, stroke 0.8s ease;
    }
    body.light-mode .bulb-envelope {
      fill: rgba(255, 255, 255, 0.25);
      stroke: rgba(0, 0, 0, 0.15);
    }

    .glass-facet {
      transition: fill 0.8s ease, stroke 0.8s ease;
    }
    body.light-mode .glass-facet {
      fill: rgba(255, 255, 255, 0.45);
      stroke: rgba(0, 0, 0, 0.08);
    }

    /* Metal Dynamic Theme Classes */
    .metal-chain {
      stroke: url(#brassChainDark);
      fill: url(#brassChainDark);
      transition: stroke var(--transition-time) ease, fill var(--transition-time) ease;
    }
    body.light-mode .metal-chain {
      stroke: url(#bronzeChainLight);
      fill: url(#bronzeChainLight);
    }

    .metal-lantern {
      fill: url(#brassBodyDark);
      stroke: url(#brassTrimDark);
      transition: fill var(--transition-time) ease, stroke var(--transition-time) ease;
    }
    body.light-mode .metal-lantern {
      fill: url(#bronzeBodyLight);
      stroke: url(#bronzeTrimLight);
    }

    /* Incandescent Ignition Pulse */
    @keyframes warmIgnition {
      0% { opacity: 0.1; filter: brightness(0.6); }
      18% { opacity: 0.95; filter: brightness(1.4); }
      32% { opacity: 0.4; filter: brightness(0.85); }
      55% { opacity: 1; filter: brightness(1.2); }
      72% { opacity: 0.82; filter: brightness(0.96); }
      100% { opacity: 1; filter: brightness(1); }
    }

    .ignite-pulse .light-cone,
    .ignite-pulse .wall-glow,
    .ignite-pulse .floor-reflection,
    .ignite-pulse .filament-core {
      animation: warmIgnition 0.42s ease-out forwards;
    }

    /* Responsive Adaptation */
    @media (max-width: 768px) {
      .hud { padding: 24px 20px; }
      .fixture-stage, .fixture-shadow {
        width: 340px;
        height: 510px;
      }
      .light-cone {
        top: 88px;
        width: 440px;
        margin-left: -220px;
        transform-origin: 220px 0px;
      }
      .wall-glow { width: 560px; height: 560px; }
      .floor-reflection { width: 480px; }
    }
  </style>
</head>
<body>

  <!-- Centered Atmosphere & Floor Glow -->
  <div class="wall-glow" id="wall-glow"></div>
  <div class="floor-reflection" id="floor-reflection"></div>
  <canvas id="dust-canvas"></canvas>

  <!-- Clean Gallery Framing HUD -->
  <div class="hud">
    <header class="hud-header">
      <div class="brand-mark">
        <h1 class="brand-title">L U M O</h1>
        <span class="brand-sub">Architectural Pendant &bull; Ed. 01</span>
      </div>
      <div class="status-badge" id="status-badge">
        <span class="status-dot"></span>
        <span id="status-text">Illuminated</span>
      </div>
    </header>

    <footer class="hud-footer">
      <div class="meta-tag">
        <span>Handcrafted Symmetrical Pendant</span><br>
        <span>Gilded Brass &bull; Beveled Crown Glass</span>
      </div>
      <div class="interaction-cue">
        <span class="cue-pulse"></span>
        <span>Pull to Swing &bull; Click to Toggle</span>
      </div>
    </footer>
  </div>

  <!-- CENTERED INTERACTIVE FIXTURE STAGE -->
  <div class="fixture-stage" id="fixture-stage">
    
    <!-- Cast Shadow Layer (Follows Pendulum Swing) -->
    <svg class="fixture-shadow" id="fixture-shadow" viewBox="0 0 200 300" fill="none">
      <g id="shadow-swing-group">
        <!-- Hood Shadow -->
        <polygon points="38,106 162,106 136,88 64,88" fill="#000" />
        <!-- Glass Body Shadow -->
        <polygon points="46,106 154,106 138,184 62,184" fill="#000" />
        <!-- Base Hearth Shadow -->
        <polygon points="60,184 140,184 132,200 68,200" fill="#000" />
        <circle cx="100" cy="208" r="5" fill="#000" />
      </g>
    </svg>

    <!-- Master Symmetrical High-Craft SVG Fixture (viewBox: 0 0 200 300, center axis x=100) -->
    <svg 
      class="fixture-svg" 
      viewBox="0 0 200 300" 
      fill="none" 
      xmlns="http://www.w3.org/2000/svg"
    >
      <defs>
        <!-- Dark Theme: Antique Gilded Brass Gradients -->
        <linearGradient id="brassChainDark" x1="90" y1="0" x2="110" y2="60" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#4d3b14" />
          <stop offset="35%" stop-color="#c49a37" />
          <stop offset="50%" stop-color="#ffe699" />
          <stop offset="75%" stop-color="#8c6a20" />
          <stop offset="100%" stop-color="#2a1f0a" />
        </linearGradient>

        <linearGradient id="brassBodyDark" x1="38" y1="74" x2="162" y2="214" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#2b1e0a" />
          <stop offset="22%" stop-color="#73541c" />
          <stop offset="48%" stop-color="#ffd56b" />
          <stop offset="68%" stop-color="#b3882e" />
          <stop offset="100%" stop-color="#362507" />
        </linearGradient>

        <linearGradient id="brassTrimDark" x1="38" y1="74" x2="162" y2="214" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#ffeeb8" />
          <stop offset="50%" stop-color="#997224" />
          <stop offset="100%" stop-color="#382608" />
        </linearGradient>

        <!-- Light Theme: Brushed Champagne Bronze Gradients -->
        <linearGradient id="bronzeChainLight" x1="90" y1="0" x2="110" y2="60" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#38322c" />
          <stop offset="35%" stop-color="#706457" />
          <stop offset="50%" stop-color="#ded8cf" />
          <stop offset="75%" stop-color="#544a40" />
          <stop offset="100%" stop-color="#26211c" />
        </linearGradient>

        <linearGradient id="bronzeBodyLight" x1="38" y1="74" x2="162" y2="214" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#2e2722" />
          <stop offset="25%" stop-color="#5c5348" />
          <stop offset="50%" stop-color="#cfc7bc" />
          <stop offset="75%" stop-color="#473f37" />
          <stop offset="100%" stop-color="#1f1b17" />
        </linearGradient>

        <linearGradient id="bronzeTrimLight" x1="38" y1="74" x2="162" y2="214" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#f5f0e6" />
          <stop offset="50%" stop-color="#695f54" />
          <stop offset="100%" stop-color="#2e2823" />
        </linearGradient>

        <!-- Crown Glass Gradients & Specular Sheen -->
        <linearGradient id="glassSheen" x1="46" y1="106" x2="154" y2="184" gradientUnits="userSpaceOnUse">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.30" />
          <stop offset="30%" stop-color="#ffe8a3" stop-opacity="0.14" />
          <stop offset="70%" stop-color="#ffffff" stop-opacity="0.05" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0.22" />
        </linearGradient>

        <linearGradient id="specularGlint" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ffffff" stop-opacity="0.65" />
          <stop offset="45%" stop-color="#ffffff" stop-opacity="0.1" />
          <stop offset="55%" stop-color="#ffffff" stop-opacity="0.55" />
          <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
        </linearGradient>

        <!-- Incandescent Tungsten Filament Bloom Filter -->
        <filter id="bulbBloom" x="-50%" y="-50%" width="200%" height="200%">
          <feGaussianBlur stdDeviation="3.8" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- STATIC CEILING CANOPY & MOUNTING (Anchor at Top Center) -->
      <g class="ceiling-anchor">
        <!-- Ceiling Rosette Canopy / Escutcheon -->
        <rect x="74" y="0" width="52" height="6" rx="2" class="metal-chain" />
        <path d="M 80 6 L 120 6 L 114 14 L 86 14 Z" class="metal-chain" />
        <ellipse cx="100" cy="14" rx="14" ry="3" class="metal-chain" />
        
        <!-- Suspension Rod from Ceiling to Pivot Ring -->
        <line x1="100" y1="14" x2="100" y2="48" class="metal-chain" stroke-width="5" stroke-linecap="round" />
        <ellipse cx="100" cy="26" rx="5" ry="2.2" class="metal-chain" />
        <ellipse cx="100" cy="40" rx="5" ry="2.2" class="metal-chain" />
        
        <!-- Ceiling Swivel Eye Ring (Interlocks with Lantern Ring at y=52) -->
        <circle cx="100" cy="50" r="7" stroke-width="3.2" fill="none" class="metal-chain" />
        <circle cx="100" cy="50" r="2.8" fill="#fff" opacity="0.4" />
      </g>

      <!-- PENDULUM SWING ASSEMBLY (Rotates strictly around SVG pivot x=100, y=52) -->
      <g id="swing-lantern-assembly">
        
        <!-- Top Suspension Loop / Ring Connector (Physically loops through ceiling ring) -->
        <circle cx="100" cy="56" r="7" stroke-width="3.2" fill="none" class="metal-lantern" />
        <rect x="94" y="64" width="12" height="8" rx="2" class="metal-lantern" />

        <!-- Pagoda Cap (Upper Tier) -->
        <path d="M 80 72 L 120 72 L 134 86 L 66 86 Z" class="metal-lantern" stroke-width="1.2" />
        <line x1="68" y1="86" x2="132" y2="86" stroke="#fff" stroke-width="1" opacity="0.35" />

        <!-- Pagoda Main Eaves Hood with Polished Lip -->
        <path d="M 64 86 L 136 86 L 162 104 L 38 104 Z" class="metal-lantern" stroke-width="1.4" />
        <line x1="36" y1="104" x2="164" y2="104" stroke="url(#specularGlint)" stroke-width="2.2" stroke-linecap="round" />

        <!-- Internal Brass Bulb Socket -->
        <rect x="93" y="104" width="14" height="8" class="metal-lantern" />

        <!-- Crown Glass Chamber (Symmetrical Beveled Facets) -->
        <polygon points="46,104 154,104 138,182 62,182" class="glass-facet" fill="url(#glassSheen)" stroke="rgba(255,255,255,0.18)" stroke-width="0.9" />

        <!-- Specular Glass Caustic Glare Reflection -->
        <path d="M 58 104 L 80 104 L 94 182 L 72 182 Z" fill="url(#specularGlint)" opacity="0.16" pointer-events="none" />

        <!-- Glowing Incandescent Edison Bulb & Tungsten Filament -->
        <g class="edison-bulb">
          <!-- Blown Glass Teardrop Bulb Envelope -->
          <ellipse cx="100" cy="132" rx="12" ry="16" class="bulb-envelope" fill="rgba(255, 235, 175, 0.12)" stroke="rgba(255, 225, 130, 0.45)" stroke-width="0.8" />
          
          <!-- Tungsten Filament Coiled Loop with Radiant Bloom -->
          <path 
            d="M 96 114 L 96 126 C 96 133, 104 133, 104 126 L 104 114" 
            stroke="#ff981a" 
            stroke-width="1.2" 
            fill="none" 
            class="filament-core" 
          />
          <circle cx="100" cy="130" r="4.8" fill="#ffffff" filter="url(#bulbBloom)" class="filament-core" />
          <circle cx="100" cy="130" r="9.5" fill="rgba(255, 190, 50, 0.38)" filter="url(#bulbBloom)" class="filament-core" />
        </g>

        <!-- Vertical Chamfered Framework Struts -->
        <line x1="46" y1="104" x2="62" y2="182" class="metal-lantern" stroke-width="2.8" stroke-linecap="round" />
        <line x1="154" y1="104" x2="138" y2="182" class="metal-lantern" stroke-width="2.8" stroke-linecap="round" />
        <line x1="100" y1="104" x2="100" y2="182" stroke="#fff" stroke-width="0.9" opacity="0.28" />

        <!-- Bottom Base Hearth -->
        <path d="M 60 182 L 140 182 L 132 198 L 68 198 Z" class="metal-lantern" stroke-width="1.4" />
        <line x1="59" y1="182" x2="141" y2="182" stroke="#fff" stroke-width="1.2" opacity="0.4" />

        <!-- Bottom Acorn Finial Drop -->
        <path d="M 94 198 C 94 208, 106 208, 106 198 Z" class="metal-lantern" />
        <circle cx="100" cy="208" r="4" class="metal-lantern" />
        <circle cx="99" cy="207" r="1.2" fill="#fff" opacity="0.55" />
      </g>
    </svg>

    <!-- Synchronized Volumetric Light Beam -->
    <div class="light-cone" id="light-cone"></div>
  </div>

  <script>
    /* ==========================================================================
       1. SPATIAL MECHANICAL AUDIO SYNTHESIZER
       ========================================================================== */
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let humOsc = null;
    let humGain = null;

    function getAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function playTactileSwitch(isActivating) {
      const ctx = getAudio();
      const t = ctx.currentTime;

      // Layer 1: High Frequency Contact Snap
      const clickOsc = ctx.createOscillator();
      const clickGain = ctx.createGain();
      const clickFilter = ctx.createBiquadFilter();

      clickOsc.type = 'triangle';
      clickOsc.frequency.setValueAtTime(isActivating ? 1800 : 1380, t);
      clickOsc.frequency.exponentialRampToValueAtTime(110, t + 0.035);

      clickFilter.type = 'highpass';
      clickFilter.frequency.value = 900;

      clickGain.gain.setValueAtTime(0.35, t);
      clickGain.gain.exponentialRampToValueAtTime(0.001, t + 0.035);

      clickOsc.connect(clickFilter);
      clickFilter.connect(clickGain);
      clickGain.connect(ctx.destination);

      clickOsc.start(t);
      clickOsc.stop(t + 0.038);

      // Layer 2: Brass Housing Resonant Ping
      const pingOsc = ctx.createOscillator();
      const pingGain = ctx.createGain();
      pingOsc.type = 'sine';
      pingOsc.frequency.setValueAtTime(isActivating ? 3200 : 2800, t);
      pingOsc.frequency.exponentialRampToValueAtTime(1850, t + 0.08);

      pingGain.gain.setValueAtTime(0.08, t);
      pingGain.gain.exponentialRampToValueAtTime(0.0001, t + 0.085);

      pingOsc.connect(pingGain);
      pingGain.connect(ctx.destination);
      pingOsc.start(t);
      pingOsc.stop(t + 0.085);

      // Layer 3: Heavy Mechanical Latch Thud
      const thudOsc = ctx.createOscillator();
      const thudGain = ctx.createGain();
      thudOsc.type = 'sine';
      thudOsc.frequency.setValueAtTime(92, t);
      thudOsc.frequency.exponentialRampToValueAtTime(32, t + 0.06);

      thudGain.gain.setValueAtTime(0.22, t);
      thudGain.gain.exponentialRampToValueAtTime(0.001, t + 0.06);

      thudOsc.connect(thudGain);
      thudGain.connect(ctx.destination);
      thudOsc.start(t);
      thudOsc.stop(t + 0.065);
    }

    function setAmbientHum(enabled) {
      const ctx = getAudio();
      const t = ctx.currentTime;

      if (enabled) {
        if (!humOsc) {
          humOsc = ctx.createOscillator();
          humGain = ctx.createGain();
          const filter = ctx.createBiquadFilter();

          humOsc.type = 'sawtooth';
          humOsc.frequency.value = 60; // 60Hz filament hum

          filter.type = 'lowpass';
          filter.frequency.value = 160;

          humGain.gain.setValueAtTime(0, t);
          humGain.gain.linearRampToValueAtTime(0.012, t + 1.2);

          humOsc.connect(filter);
          filter.connect(humGain);
          humGain.connect(ctx.destination);
          humOsc.start();
        }
      } else {
        if (humGain && humOsc) {
          humGain.gain.linearRampToValueAtTime(0, t + 0.35);
          setTimeout(() => {
            if (humOsc) {
              humOsc.stop();
              humOsc.disconnect();
              humOsc = null;
              humGain = null;
            }
          }, 380);
        }
      }
    }

    /* ==========================================================================
       2. CINEMATIC ATMOSPHERIC DUST PARTICLES
       ========================================================================== */
    const canvas = document.getElementById('dust-canvas');
    const ctx = canvas.getContext('2d');
    let motes = [];
    const MOTE_COUNT = 65;

    let mousePos = { x: window.innerWidth * 0.5, y: window.innerHeight * 0.5 };

    window.addEventListener('mousemove', (e) => {
      mousePos.x = e.clientX;
      mousePos.y = e.clientY;
    });

    function initMotes() {
      motes = [];
      for (let i = 0; i < MOTE_COUNT; i++) {
        motes.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          r: Math.random() * 1.5 + 0.3,
          vx: (Math.random() - 0.5) * 0.22,
          vy: (Math.random() - 0.5) * 0.18 - 0.08,
          alpha: Math.random() * 0.55 + 0.1,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initMotes();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function renderMotes() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const isLit = !document.body.classList.contains('light-mode');
      if (!isLit) return;

      const stage = document.getElementById('fixture-stage');
      const rect = stage.getBoundingClientRect();
      const bulbX = rect.left + rect.width * 0.5;
      const bulbY = rect.top + rect.height * (132 / 300);

      for (let i = 0; i < motes.length; i++) {
        const m = motes[i];
        
        // Gentle cursor interaction
        const cdx = mousePos.x - m.x;
        const cdy = mousePos.y - m.y;
        const cDist = Math.sqrt(cdx * cdx + cdy * cdy);
        if (cDist < 140) {
          const force = (140 - cDist) / 140 * 0.08;
          m.vx -= (cdx / cDist) * force;
          m.vy -= (cdy / cDist) * force;
        }

        m.x += m.vx;
        m.y += m.vy;
        m.phase += 0.02;

        if (m.x < 0) m.x = canvas.width;
        if (m.x > canvas.width) m.x = 0;
        if (m.y < 0) m.y = canvas.height;
        if (m.y > canvas.height) m.y = 0;

        // Illumination boost near the bulb
        const bdx = bulbX - m.x;
        const bdy = bulbY - m.y;
        const bDist = Math.sqrt(bdx * bdx + bdy * bdy);
        let illumination = 1;
        if (bDist < 300) {
          illumination = 1 + (300 - bDist) / 300 * 2.2;
        }

        const currentAlpha = Math.min(0.85, (m.alpha + Math.sin(m.phase) * 0.15) * illumination);

        ctx.beginPath();
        ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 215, 120, ${currentAlpha})`;
        ctx.fill();
      }
    }

    /* ==========================================================================
       3. BULLETPROOF PENDULUM KINETICS & DRAG ENGINE
       ========================================================================== */
    const stage = document.getElementById('fixture-stage');
    const swingGroup = document.getElementById('swing-lantern-assembly');
    const shadowGroup = document.getElementById('shadow-swing-group');
    const lightCone = document.getElementById('light-cone');
    const statusText = document.getElementById('status-text');

    let angle = 0;
    let angularVel = 0;
    let angularAcc = 0;
    const gravity = 0.38;
    const armLength = 120;
    const damping = 0.982;
    let time = 0;

    // Interactive Drag Physics
    let isDragging = false;
    let dragStartX = 0;
    let dragStartAngle = 0;
    let hasDraggedSignificantly = false;

    // Pivot coordinate in SVG viewBox (200x300) is (100, 52)
    const PIVOT_SVG_X = 100;
    const PIVOT_SVG_Y = 52;

    function getPivotCoords() {
      const rect = stage.getBoundingClientRect();
      return {
        x: rect.left + rect.width * (PIVOT_SVG_X / 200),
        y: rect.top + rect.height * (PIVOT_SVG_Y / 300)
      };
    }

    function onPointerDown(e) {
      isDragging = true;
      hasDraggedSignificantly = false;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      dragStartX = clientX;
      dragStartAngle = angle;
      angularVel = 0;
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      
      const deltaX = clientX - dragStartX;
      if (Math.abs(deltaX) > 4) {
        hasDraggedSignificantly = true;
      }

      const pivot = getPivotCoords();
      const rad = Math.atan2(clientX - pivot.x, clientY - pivot.y);
      // Realistic pendulum angle limit (-48 deg to 48 deg)
      const maxRad = 0.84;
      angle = Math.max(-maxRad, Math.min(maxRad, rad));
    }

    function onPointerUp() {
      if (isDragging) {
        isDragging = false;
        if (!hasDraggedSignificantly) {
          // Clean Click Toggle
          toggleLighting();
        } else {
          // Impart swing release momentum
          angularVel = (Math.random() > 0.5 ? 1 : -1) * 0.025;
        }
      }
    }

    stage.addEventListener('mousedown', onPointerDown);
    window.addEventListener('mousemove', onPointerMove);
    window.addEventListener('mouseup', onPointerUp);

    stage.addEventListener('touchstart', onPointerDown, { passive: true });
    window.addEventListener('touchmove', onPointerMove, { passive: true });
    window.addEventListener('touchend', onPointerUp);

    function toggleLighting() {
      const isNowLight = document.body.classList.toggle('light-mode');
      playTactileSwitch(!isNowLight);
      
      if (!isNowLight) {
        // Ignite sequence
        document.body.classList.remove('ignite-pulse');
        void document.body.offsetWidth;
        document.body.classList.add('ignite-pulse');
        statusText.textContent = "Illuminated";
        setAmbientHum(true);
      } else {
        document.body.classList.remove('ignite-pulse');
        statusText.textContent = "Extinguished";
        setAmbientHum(false);
      }

      // Dynamic kinetic impulse on toggle
      angularVel += (Math.random() > 0.5 ? 1 : -1) * 0.06;
    }

    /* ==========================================================================
       4. 60FPS KINETIC RENDER LOOP (PRECISE SINGLE-SOURCE SVG ROTATION)
       ========================================================================== */
    function renderLoop() {
      time += 0.016;

      if (!isDragging) {
        // Natural gentle air turbulence
        const breeze = Math.sin(time * 0.85) * Math.sin(time * 1.3 + 1.1) * 0.022;
        angularAcc = (-gravity / armLength) * Math.sin(angle - breeze);
        angularVel += angularAcc;
        angularVel *= damping;
        angle += angularVel;
      }

      const deg = angle * (180 / Math.PI);

      // 1. Swing Lantern Assembly strictly around SVG user pivot (100, 52)
      // No CSS transform-origin interference — 100% stable, zero detachment!
      swingGroup.setAttribute('transform', `rotate(${deg} ${PIVOT_SVG_X} ${PIVOT_SVG_Y})`);

      // 2. Counter-swaying Cast Shadow on Wall
      shadowGroup.setAttribute('transform', `rotate(${deg * 0.85} ${PIVOT_SVG_X} ${PIVOT_SVG_Y})`);

      // 3. Volumetric Cone Swing (top of cone is matched to pivot height)
      lightCone.style.transform = `rotate(${deg}deg)`;

      // 4. Atmospheric Dust Particle Render
      renderMotes();

      requestAnimationFrame(renderLoop);
    }

    // Gentle initial sway
    angularVel = 0.035;
    renderLoop();

    // First user interaction unlocks Web Audio
    document.addEventListener('click', () => {
      getAudio();
      if (!document.body.classList.contains('light-mode')) {
        setAmbientHum(true);
      }
    }, { once: true });
  </script>
</body>
</html>
