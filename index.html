<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumo - Luxury</title>
  <style>
    :root {
      --transition-time: 1.2s;
      --gold-light: #ffea75;
      --gold-mid: #d4af37;
      --gold-dark: #6e5c1e;
      --gold-shadow: #2a2205;
    }

    body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
      /* Deep luxury studio void */
      background: radial-gradient(circle at 50% 50%, #1a1510 0%, #050403 100%);
      transition: background var(--transition-time) ease;
      user-select: none; -webkit-user-select: none;
    }

    body.light-mode {
      /* Premium studio white seamless paper sweep */
      background: radial-gradient(circle at 50% 40%, #ffffff 0%, #e8e6e1 100%);
    }

    /* Ambient Glow on Wall */
    .wall-glow {
      position: absolute; bottom: 18vh; left: 50%; transform: translate(-50%, 45%);
      width: 1200px; height: 900px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 200, 70, 0.25) 0%, rgba(255, 170, 40, 0.08) 35%, transparent 70%);
      z-index: 1; pointer-events: none;
      transition: opacity var(--transition-time) ease;
    }
    body.light-mode .wall-glow { opacity: 0; }

    /* Table Glow */
    .table-glow {
      position: absolute; bottom: 18vh; left: 50%;
      transform: translate(-50%, 50%) rotateX(75deg);
      width: 900px; height: 900px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 210, 100, 0.4) 0%, rgba(200, 130, 30, 0.1) 40%, transparent 65%);
      mix-blend-mode: screen; z-index: 2; pointer-events: none;
      transition: opacity var(--transition-time) ease;
    }
    body.light-mode .table-glow { opacity: 0; }

    .vignette-dark {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 30;
      transition: opacity var(--transition-time) ease;
      background: radial-gradient(circle at 50% 45%, transparent 10%, rgba(0,0,0,0.98) 100%);
    }
    body.light-mode .vignette-dark { opacity: 0; }

    #dust-canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 10;
      transition: opacity var(--transition-time) ease;
    }
    body.light-mode #dust-canvas { opacity: 0; }

    /* Lamp Container */
    .lamp-container {
      position: absolute; bottom: 18vh; left: 50%; transform: translateX(-50%);
      width: 320px; height: 600px;
      z-index: 20; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }

    .base-shadow {
      position: absolute; bottom: -15px; left: 50%; margin-left: -120px;
      width: 240px; height: 30px; border-radius: 50%;
      background: rgba(0,0,0,0.8); filter: blur(15px);
      z-index: 0; transition: background var(--transition-time) ease, opacity var(--transition-time) ease;
    }
    .base-shadow::after {
      content: ''; position: absolute; bottom: 8px; left: 50%; margin-left: -60px;
      width: 120px; height: 12px; border-radius: 50%;
      background: rgba(0,0,0,1); filter: blur(3px);
    }
    body.light-mode .base-shadow { background: rgba(0,0,0,0.25); }
    body.light-mode .base-shadow::after { background: rgba(0,0,0,0.5); }

    /* High-end Modern Matte Base */
    .lamp-base {
      position: absolute; bottom: 0; left: 50%; margin-left: -70px;
      width: 140px; height: 35px; border-radius: 4px;
      z-index: 1;
      /* Matte Black */
      background: linear-gradient(to right, #0a0a0a 0%, #2a2a2a 20%, #3a3a3a 40%, #1a1a1a 80%, #050505 100%);
      box-shadow: inset 0 2px 2px rgba(255,255,255,0.1), inset 0 -2px 5px rgba(0,0,0,1), 0 5px 15px rgba(0,0,0,0.8);
      transition: background var(--transition-time) ease, box-shadow var(--transition-time) ease;
    }
    body.light-mode .lamp-base { 
      /* Matte White */
      background: linear-gradient(to right, #d4d4d4 0%, #ffffff 20%, #f5f5f5 40%, #e0e0e0 80%, #c4c4c4 100%);
      box-shadow: inset 0 2px 2px rgba(255,255,255,1), inset 0 -2px 5px rgba(0,0,0,0.1), 0 5px 15px rgba(0,0,0,0.2);
    }

    /* Thick Modern Stem */
    .lamp-stem {
      position: absolute; bottom: 35px; left: 50%; margin-left: -15px;
      width: 30px; height: 320px; z-index: 1;
      background: linear-gradient(to right, #050505 0%, #2a2a2a 25%, #333 45%, #111 80%, #000 100%);
      transition: background var(--transition-time) ease;
    }
    body.light-mode .lamp-stem { 
      background: linear-gradient(to right, #c0c0c0 0%, #f5f5f5 25%, #ffffff 45%, #d9d9d9 80%, #b3b3b3 100%);
    }

    /* Soft Diffused Light Cone */
    .light-cone {
      position: absolute; top: 180px; left: 50%; margin-left: -350px;
      width: 700px; height: 420px;
      background: linear-gradient(to bottom, rgba(255, 235, 180, 0.5) 0%, rgba(255, 200, 100, 0.05) 80%, transparent 100%);
      
      /* Soft conic mask */
      -webkit-mask-image: conic-gradient(from 120deg at 50% -10%, transparent 0deg, rgba(0,0,0,0.1) 10deg, rgba(0,0,0,1) 30deg, rgba(0,0,0,1) 90deg, rgba(0,0,0,0.1) 110deg, transparent 120deg);
      mask-image: conic-gradient(from 120deg at 50% -10%, transparent 0deg, rgba(0,0,0,0.1) 10deg, rgba(0,0,0,1) 30deg, rgba(0,0,0,1) 90deg, rgba(0,0,0,0.1) 110deg, transparent 120deg);
      
      z-index: 5; pointer-events: none; mix-blend-mode: screen;
      transition: opacity var(--transition-time) ease;
    }
    body.light-mode .light-cone { opacity: 0; }

    /* Ambient Core Glow */
    .core-glow {
      position: absolute; top: 195px; left: 50%; margin-left: -100px;
      width: 200px; height: 30px; border-radius: 50%;
      background: #fff8de; filter: blur(20px);
      z-index: 6; pointer-events: none; mix-blend-mode: screen;
      transition: opacity var(--transition-time) ease;
    }
    body.light-mode .core-glow { opacity: 0; }

    /* Perfectly Smooth Modern Dome Shade */
    .lamp-shade {
      position: absolute; top: 35px; left: 50%; margin-left: -160px;
      width: 320px; height: 160px; z-index: 10;
      /* Perfect hemisphere */
      border-radius: 160px 160px 0 0;
      
      background: linear-gradient(to right, #0a0a0a 0%, #2a2a2a 35%, #3a3a3a 50%, #1a1a1a 85%, #050505 100%);
      box-shadow: inset 0 2px 5px rgba(255,255,255,0.05);
      transition: background var(--transition-time) ease;
    }
    /* Bottom rim highlight */
    .lamp-shade::after {
      content: ''; position: absolute; bottom: 0; left: 0; width: 100%; height: 2px;
      background: rgba(255,255,255,0.1);
    }
    body.light-mode .lamp-shade { 
      background: linear-gradient(to right, #c4c4c4 0%, #f5f5f5 35%, #ffffff 50%, #e0e0e0 85%, #b3b3b3 100%);
      box-shadow: inset 0 2px 5px rgba(255,255,255,1), 0 10px 30px rgba(0,0,0,0.05);
    }
    body.light-mode .lamp-shade::after { background: rgba(0,0,0,0.05); }

    /* Frosted Acrylic Diffuser (Under the Shade) */
    .lamp-opening {
      position: absolute; top: 180px; left: 50%; margin-left: -155px;
      width: 310px; height: 30px; border-radius: 50%; z-index: 9;
      background: radial-gradient(ellipse at 50% 50%, #ffffff 0%, #ffebb3 40%, #ffa600 100%);
      box-shadow: inset 0 0 15px rgba(0,0,0,0.2), 0 5px 15px rgba(255, 180, 50, 0.4);
      transition: opacity var(--transition-time) ease, box-shadow var(--transition-time) ease;
    }
    /* When off (light mode), it looks like opaque white acrylic */
    body.light-mode .lamp-opening { 
      background: #f8f8f8;
      box-shadow: inset 0 5px 15px rgba(0,0,0,0.1);
    }

    /* Minimalist Pull Cord */
    .pull-chain {
      position: absolute; top: 195px; left: 50%; margin-left: -1px; width: 2px; height: 110px;
      z-index: 4; transform-origin: top center;
    }
    .pull-chain::before {
      content:''; position:absolute; top:0; left:0; width:100%; height:100%;
      background: #2a2a2a; transition: background var(--transition-time) ease;
    }
    body.light-mode .pull-chain::before { background: #b3b3b3; }

    .pull-chain-handle {
      position: absolute; bottom: -20px; left: -3px; width: 8px; height: 25px; border-radius: 10px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.5);
    }
    .pull-chain-handle::before {
      content:''; position:absolute; top:0; left:0; width:100%; height:100%; border-radius: inherit; 
      background: linear-gradient(to right, #111, #444, #111); transition: background var(--transition-time) ease;
    }
    body.light-mode .pull-chain-handle::before { 
      background: linear-gradient(to right, #aaa, #e0e0e0, #aaa); box-shadow: 0 3px 6px rgba(0,0,0,0.1);
    }

    /* Flicker Animation */
    @keyframes flickerAnim {
      0% { opacity: 0.1; }
      10% { opacity: 1; }
      20% { opacity: 0.2; }
      30% { opacity: 1; }
      45% { opacity: 0.5; }
      60% { opacity: 1; }
      80% { opacity: 0.8; }
      100% { opacity: 1; }
    }
    .flicker-active .table-glow,
    .flicker-active .wall-glow,
    .flicker-active .lamp-opening,
    .flicker-active .core-glow,
    .flicker-active .light-cone {
      animation: flickerAnim 0.35s ease-out forwards;
    }

  </style>
</head>
<body>

  <div class="vignette-dark"></div>
  <div class="grain-overlay"></div>
  <canvas id="dust-canvas"></canvas>

  <div class="wall-glow"></div>
  <div class="table-glow"></div>
  
  <div class="lamp-container" id="lamp-container">
    <div class="base-shadow"></div>
    <div class="lamp-base"></div>
    <div class="lamp-stem"></div>
    
    <div class="light-cone"></div>
    <div class="core-glow"></div>
    
    <div class="lamp-shade"></div>
    <div class="lamp-opening"></div>
    
    <div class="pull-chain" id="pull-chain">
      <div class="pull-chain-handle"></div>
    </div>
  </div>

  <script>
    // Audio Context Setup
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    let humOsc, humGain;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playClickSound() {
      initAudio();
      const t = audioCtx.currentTime;
      
      function snap(time) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        
        osc.type = 'square';
        osc.frequency.setValueAtTime(500, time);
        osc.frequency.exponentialRampToValueAtTime(100, time + 0.04);
        
        filter.type = 'highpass';
        filter.frequency.value = 800;
        
        gain.gain.setValueAtTime(0.3, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.04);
        
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start(time);
        osc.stop(time + 0.04);
      }
      
      snap(t);
      snap(t + 0.1); 
    }

    function toggleHum(isDark) {
      initAudio();
      if (isDark) {
        humOsc = audioCtx.createOscillator();
        humGain = audioCtx.createGain();
        humOsc.type = 'sawtooth';
        humOsc.frequency.value = 60;
        
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 150;
        
        humGain.gain.setValueAtTime(0, audioCtx.currentTime);
        humGain.gain.linearRampToValueAtTime(0.015, audioCtx.currentTime + 1);
        
        humOsc.connect(filter);
        filter.connect(humGain);
        humGain.connect(audioCtx.destination);
        humOsc.start();
      } else {
        if (humGain) {
          humGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
          setTimeout(() => { if (humOsc) humOsc.stop(); }, 350);
        }
      }
    }

    // Canvas Dust & Fireflies
    const canvas = document.getElementById('dust-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let fireflies = [];
    const particleCount = 70;

    let targetMouseX = window.innerWidth / 2;
    let targetMouseY = window.innerHeight / 2;
    document.addEventListener('mousemove', (e) => {
      targetMouseX = e.clientX;
      targetMouseY = e.clientY;
    });

    function initParticles() {
      particles = [];
      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          radius: Math.random() * 1.5 + 0.3,
          vx: (Math.random() - 0.5) * 0.2,
          vy: (Math.random() - 0.5) * 0.2,
          baseOpacity: Math.random() * 0.6 + 0.1,
          currentOpacity: Math.random() * 0.6
        });
      }
      fireflies = [];
      for (let i = 0; i < 4; i++) {
        fireflies.push({
          x: window.innerWidth / 2 + (Math.random() - 0.5) * 150,
          y: window.innerHeight * 0.4 + (Math.random() - 0.5) * 150,
          vx: 0, vy: 0, angle: Math.random() * Math.PI * 2
        });
      }
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initParticles();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawDust() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const isDark = !document.body.classList.contains('light-mode');
      
      particles.forEach(p => {
        const dx = targetMouseX - p.x;
        const dy = targetMouseY - p.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 120) {
          const force = (120 - dist) / 120;
          p.vx -= (dx / dist) * force * 0.1;
          p.vy -= (dy / dist) * force * 0.1;
        }

        p.x += p.vx;
        p.y += p.vy - 0.15;
        p.vx *= 0.99;
        
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;
        
        p.currentOpacity += (Math.random() - 0.5) * 0.04;
        p.currentOpacity = Math.max(0, Math.min(p.baseOpacity, p.currentOpacity));
        
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        // Golden dust
        ctx.fillStyle = `rgba(255, 200, 100, ${p.currentOpacity})`;
        ctx.fill();
      });

      if (isDark) {
        const lampX = window.innerWidth / 2;
        const lampY = window.innerHeight * 0.45;
        
        fireflies.forEach(f => {
          const dx = lampX - f.x;
          const dy = lampY - f.y;
          
          f.vx += dx * 0.0001;
          f.vy += dy * 0.0001;
          
          f.angle += (Math.random() - 0.5) * 0.6;
          f.vx += Math.cos(f.angle) * 0.2;
          f.vy += Math.sin(f.angle) * 0.2;
          
          f.vx *= 0.95;
          f.vy *= 0.95;
          f.x += f.vx;
          f.y += f.vy;
          
          const glowIntensity = Math.random() * 0.5 + 0.5;
          ctx.beginPath();
          ctx.arc(f.x, f.y, 1.5, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 240, 150, ${glowIntensity})`;
          ctx.fill();
          
          ctx.beginPath();
          ctx.arc(f.x, f.y, 6, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 150, 0, ${glowIntensity * 0.25})`;
          ctx.fill();
        });
      }
    }

    // Parallax and Physics for the Pull Chain
    const lampContainer = document.getElementById('lamp-container');
    const pullChain = document.getElementById('pull-chain');

    let angle = 0;
    let angularVelocity = 0;
    let angularAcceleration = 0;
    let time = 0;
    const gravity = 0.4;
    const length = 80;
    const damping = 0.98;

    function animate() {
      time += 0.016;
      
      const breezeTarget = (Math.sin(time * 0.8) * Math.sin(time * 1.3 + 1)) * 0.04;
      angularAcceleration = (-gravity / length) * Math.sin(angle - breezeTarget);
      
      angularVelocity += angularAcceleration;
      angularVelocity *= damping;
      angle += angularVelocity;
      
      pullChain.style.transform = `rotate(${angle * (180 / Math.PI)}deg)`;
      
      drawDust();
      requestAnimationFrame(animate);
    }

    lampContainer.addEventListener('click', () => {
      const isLight = document.body.classList.toggle('light-mode');
      
      playClickSound();
      
      if (!isLight) {
        document.body.classList.remove('flicker-active');
        void document.body.offsetWidth;
        document.body.classList.add('flicker-active');
        toggleHum(true);
      } else {
        document.body.classList.remove('flicker-active');
        toggleHum(false);
      }

      const impulse = (Math.random() > 0.5 ? 1 : -1) * 0.05;
      angularVelocity += impulse;
      if (angularVelocity > 0.2) angularVelocity = 0.2;
      if (angularVelocity < -0.2) angularVelocity = -0.2;
    });

    angularVelocity = 0.02;
    animate();
    
    document.addEventListener('click', () => {
      if (!document.body.classList.contains('light-mode') && !humOsc) {
        toggleHum(true);
      }
    }, { once: true });
  </script>
</body>
</html>
