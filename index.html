<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumo - Vintage Wall Lantern</title>
  <style>
    :root {
      --transition-time: 1.2s;
    }

    body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
      /* Deep luxury studio void */
      background: radial-gradient(circle at 50% 50%, #1a1510 0%, #050403 100%);
      transition: background var(--transition-time) ease;
      user-select: none; -webkit-user-select: none;
      color: #fff;
    }

    body.light-mode {
      /* Premium studio white seamless paper sweep */
      background: radial-gradient(circle at 50% 40%, #ffffff 0%, #e8e6e1 100%);
      color: #111;
    }

    #dust-canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 10;
      transition: opacity var(--transition-time) ease;
    }
    body.light-mode #dust-canvas { opacity: 0; }

    /* The Massive Wall Lantern */
    .lantern-container {
      position: absolute; top: 15vh; right: 0;
      width: 420px; height: 600px;
      z-index: 20; cursor: pointer; -webkit-tap-highlight-color: transparent;
      filter: drop-shadow(-10px 20px 20px rgba(0,0,0,0.8));
      transition: filter var(--transition-time) ease;
    }
    body.light-mode .lantern-container {
      filter: drop-shadow(-10px 20px 20px rgba(0,0,0,0.2));
    }

    .lantern-svg {
      width: 100%; height: 100%;
      /* Base colors for the metal */
      color: #ffd700; 
      transition: color var(--transition-time) ease;
    }
    body.light-mode .lantern-svg {
      color: #222;
    }

    #lantern-body {
      transform-origin: 35.7% 50%; /* x=50, y=100 in 140x200 viewBox */
    }

    /* Beautiful Glowing Bulb */
    .bulb {
      fill: #ffeba8;
      filter: drop-shadow(0 0 10px #ffaa00) drop-shadow(0 0 30px #ffaa00);
      transition: opacity var(--transition-time) ease;
    }
    body.light-mode .bulb { opacity: 0; }
    
    .glass-pane {
      fill: rgba(255, 230, 150, 0.15);
      transition: fill var(--transition-time) ease;
    }
    body.light-mode .glass-pane { fill: rgba(0,0,0,0.05); }

    /* Slanted Volumetric Light Cone attached to the swinging lantern */
    .light-cone {
      position: absolute; top: 300px; left: 0px;
      width: 300px; height: 600px;
      background: linear-gradient(to bottom, transparent 165px, rgba(255, 220, 100, 0.45) 165px, rgba(255, 170, 30, 0.05) 80%, transparent 100%);
      
      /* Cone mask starting at bulb location (165px down from pivot) */
      -webkit-mask-image: conic-gradient(from 150deg at 50% 165px, transparent 0deg, rgba(0,0,0,0.2) 15deg, rgba(0,0,0,1) 30deg, rgba(0,0,0,1) 60deg, rgba(0,0,0,0.2) 75deg, transparent 90deg);
      mask-image: conic-gradient(from 150deg at 50% 165px, transparent 0deg, rgba(0,0,0,0.2) 15deg, rgba(0,0,0,1) 30deg, rgba(0,0,0,1) 60deg, rgba(0,0,0,0.2) 75deg, transparent 90deg);
      
      pointer-events: none; mix-blend-mode: screen;
      transform-origin: 150px 0px;
      transition: opacity var(--transition-time) ease;
    }
    body.light-mode .light-cone { opacity: 0; }

    /* Wall Core Glow */
    .core-glow {
      position: absolute; top: 50%; right: 50px; transform: translateY(-50%);
      width: 400px; height: 600px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 200, 50, 0.15) 0%, transparent 70%);
      z-index: 1; pointer-events: none; mix-blend-mode: screen;
      transition: opacity var(--transition-time) ease;
    }
    body.light-mode .core-glow { opacity: 0; }

    /* Flicker Animation */
    @keyframes flickerAnim {
      0% { opacity: 0.1; }
      10% { opacity: 1; }
      20% { opacity: 0.2; }
      30% { opacity: 1; }
      45% { opacity: 0.5; }
      60% { opacity: 1; }
      80% { opacity: 0.8; }
      100% { opacity: 1; }
    }
    .flicker-active .bulb,
    .flicker-active .core-glow,
    .flicker-active .light-cone {
      animation: flickerAnim 0.35s ease-out forwards;
    }

  </style>
</head>
<body>

  <canvas id="dust-canvas"></canvas>
  <div class="core-glow"></div>
  
  <div class="lantern-container" id="lamp-container">
    <svg 
      class="lantern-svg"
      viewBox="0 0 140 200" 
      fill="none" 
      xmlns="http://www.w3.org/2000/svg" 
    >
      <!-- Static Wall Mount Plate & Bracket -->
      <g class="bracket">
        <!-- Wall Plate -->
        <rect x="130" y="10" width="10" height="120" rx="2" fill="currentColor" opacity="0.9" />
        
        <!-- Main Ornate Bracket -->
        <path 
          d="M 130 25 C 70 25, 50 60, 50 100 C 50 120, 80 130, 100 110 C 110 100, 105 85, 95 85" 
          stroke="currentColor" 
          stroke-width="6" 
          stroke-linecap="round" 
        />
        <!-- Secondary Bracket Swirl -->
        <path 
          d="M 130 80 C 100 80, 90 100, 100 120 C 110 130, 125 125, 125 110" 
          stroke="currentColor" 
          stroke-width="3" 
          stroke-linecap="round" 
        />
      </g>
      
      <!-- Hanging Lantern Body (this swings) -->
      <g id="lantern-body">
        <!-- Connecting rod -->
        <line x1="50" y1="100" x2="50" y2="115" stroke="currentColor" stroke-width="4" />
        
        <!-- Lantern Cap -->
        <path d="M 25 130 L 75 130 L 60 115 L 40 115 Z" fill="currentColor" />
        <path d="M 20 135 L 80 135 L 75 130 L 25 130 Z" fill="currentColor" />
        
        <!-- Lantern Glass Body -->
        <path d="M 25 135 L 75 135 L 65 180 L 35 180 Z" class="glass-pane" />
        
        <!-- The Bulb! -->
        <circle cx="50" cy="155" r="8" class="bulb" />

        <!-- Glass Panes / Frame -->
        <path d="M 32 135 L 42 180 M 68 135 L 58 180" stroke="currentColor" stroke-width="2" />
        
        <!-- Lantern Bottom -->
        <path d="M 35 180 L 65 180 L 60 190 L 40 190 Z" fill="currentColor" />
        <circle cx="50" cy="195" r="4" fill="currentColor" />

        <!-- The Light Cone is injected inside the SVG coordinate space using foreignObject or just CSS on a div? 
             Actually, mapping a CSS div to SVG coordinates is tricky. Let's just put the light cone div over it. -->
      </g>
    </svg>
    <!-- We place the light cone absolutely within the lantern container so we can swing it perfectly matching the SVG -->
    <div id="light-cone" class="light-cone"></div>
  </div>

  <script>
    // Audio Context Setup
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    let humOsc, humGain;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playClickSound() {
      initAudio();
      const t = audioCtx.currentTime;
      function snap(time) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        osc.type = 'square';
        osc.frequency.setValueAtTime(400, time);
        osc.frequency.exponentialRampToValueAtTime(80, time + 0.05);
        filter.type = 'highpass'; filter.frequency.value = 800;
        gain.gain.setValueAtTime(0.4, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.05);
        osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
        osc.start(time); osc.stop(time + 0.05);
      }
      snap(t); snap(t + 0.08); 
    }

    function toggleHum(isDark) {
      initAudio();
      if (isDark) {
        humOsc = audioCtx.createOscillator();
        humGain = audioCtx.createGain();
        humOsc.type = 'sawtooth';
        humOsc.frequency.value = 60;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass'; filter.frequency.value = 150;
        humGain.gain.setValueAtTime(0, audioCtx.currentTime);
        humGain.gain.linearRampToValueAtTime(0.015, audioCtx.currentTime + 1);
        humOsc.connect(filter); filter.connect(humGain); humGain.connect(audioCtx.destination);
        humOsc.start();
      } else {
        if (humGain) {
          humGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
          setTimeout(() => { if (humOsc) humOsc.stop(); }, 350);
        }
      }
    }

    // Canvas Dust
    const canvas = document.getElementById('dust-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const particleCount = 80;

    let targetMouseX = window.innerWidth / 2;
    let targetMouseY = window.innerHeight / 2;
    document.addEventListener('mousemove', (e) => {
      targetMouseX = e.clientX; targetMouseY = e.clientY;
    });

    function initParticles() {
      particles = [];
      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          radius: Math.random() * 1.5 + 0.3,
          vx: (Math.random() - 0.5) * 0.2,
          vy: (Math.random() - 0.5) * 0.2,
          baseOpacity: Math.random() * 0.6 + 0.1,
          currentOpacity: Math.random() * 0.6
        });
      }
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initParticles();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawDust() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        const dx = targetMouseX - p.x;
        const dy = targetMouseY - p.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 150) {
          const force = (150 - dist) / 150;
          p.vx -= (dx / dist) * force * 0.05;
          p.vy -= (dy / dist) * force * 0.05;
        }
        p.x += p.vx; p.y += p.vy - 0.15;
        p.vx *= 0.99; p.vy *= 0.99;
        
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;
        
        p.currentOpacity += (Math.random() - 0.5) * 0.04;
        p.currentOpacity = Math.max(0, Math.min(p.baseOpacity, p.currentOpacity));
        
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255, 200, 100, ${p.currentOpacity})`;
        ctx.fill();
      });
    }

    // Physics Engine for the SVG Lantern Body
    const lampContainer = document.getElementById('lamp-container');
    const lanternBody = document.getElementById('lantern-body');
    const lightCone = document.getElementById('light-cone');

    let angle = 0;
    let angularVelocity = 0;
    let angularAcceleration = 0;
    let time = 0;
    const gravity = 0.4;
    const length = 120;
    const damping = 0.97;

    function animate() {
      time += 0.016;
      
      const breezeTarget = (Math.sin(time * 0.8) * Math.sin(time * 1.3 + 1)) * 0.04;
      angularAcceleration = (-gravity / length) * Math.sin(angle - breezeTarget);
      
      angularVelocity += angularAcceleration;
      angularVelocity *= damping;
      angle += angularVelocity;
      
      // Swing the SVG group!
      const angleDeg = angle * (180 / Math.PI);
      lanternBody.style.transform = `rotate(${angleDeg}deg)`;
      
      // Swing the CSS light cone to match!
      // The light cone is placed relative to the lantern container.
      // We need to offset its origin to exactly match the SVG pivot point (x=50, y=100)
      // Since container is 420x600 mapping to 140x200 viewBox: scale is 3x.
      // SVG pivot x=50, y=100 -> CSS pivot x=150px, y=300px
      // Light cone top is placed at y=300px.
      lightCone.style.transform = `rotate(${angleDeg}deg)`;
      
      drawDust();
      requestAnimationFrame(animate);
    }

    // Set accurate pivot for light cone
    lightCone.style.top = '300px'; 
    lightCone.style.left = '0px'; 
    lightCone.style.width = '300px';
    lightCone.style.marginLeft = '0px'; // clear previous margins
    lightCone.style.transformOrigin = '150px 0px'; // Pivot at center top

    lampContainer.addEventListener('click', () => {
      const isLight = document.body.classList.toggle('light-mode');
      playClickSound();
      
      if (!isLight) {
        document.body.classList.remove('flicker-active');
        void document.body.offsetWidth;
        document.body.classList.add('flicker-active');
        toggleHum(true);
      } else {
        document.body.classList.remove('flicker-active');
        toggleHum(false);
      }

      const impulse = (Math.random() > 0.5 ? 1 : -1) * 0.1;
      angularVelocity += impulse;
    });

    angularVelocity = 0.05;
    animate();
    
    document.addEventListener('click', () => {
      if (!document.body.classList.contains('light-mode') && !humOsc) {
        toggleHum(true);
      }
    }, { once: true });
  </script>
</body>
</html>
