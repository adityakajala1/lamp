<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumo - Luxury</title>
  <style>
    :root {
      --transition-time: 1.2s;
      --gold-light: #ffea75;
      --gold-mid: #d4af37;
      --gold-dark: #6e5c1e;
      --gold-shadow: #2a2205;
    }

    body {
      margin: 0; padding: 0;
      width: 100vw; height: 100vh;
      overflow: hidden;
      background-color: #0c0a08;
      transition: background-color var(--transition-time) ease;
      user-select: none; -webkit-user-select: none;
    }

    body.light-mode {
      background-color: #1a1714;
    }

    /* Photorealistic Ribbed Wall */
    .wall-texture {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: repeating-linear-gradient(
        to right,
        #050403 0px,
        #14110e 3px,
        #2a221a 6px,
        #050403 9px,
        #050403 14px
      );
      z-index: 0;
      transition: opacity var(--transition-time) ease;
    }
    body.light-mode .wall-texture {
      background: repeating-linear-gradient(
        to right,
        #15110d 0px,
        #2a241c 3px,
        #40352a 6px,
        #15110d 9px,
        #15110d 14px
      );
    }

    /* Table Surface */
    .table-surface {
      position: absolute; bottom: 0; left: 0; width: 100vw; height: 18vh;
      background: linear-gradient(to bottom, #140d0a, #050302);
      border-top: 1px solid #221813;
      z-index: 1;
      transition: filter var(--transition-time) ease;
    }
    body.light-mode .table-surface {
      background: linear-gradient(to bottom, #2b1c15, #0d0805);
    }

    /* Ambient Glow on Wall */
    .wall-glow {
      position: absolute; bottom: 18vh; left: 50%; transform: translate(-50%, 45%);
      width: 1200px; height: 900px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 200, 70, 0.25) 0%, rgba(255, 170, 40, 0.08) 35%, transparent 70%);
      z-index: 1; pointer-events: none;
      transition: opacity var(--transition-time) ease;
    }
    body.light-mode .wall-glow { opacity: 0; }

    /* Table Glow */
    .table-glow {
      position: absolute; bottom: 18vh; left: 50%;
      transform: translate(-50%, 50%) rotateX(75deg);
      width: 900px; height: 900px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 210, 100, 0.4) 0%, rgba(200, 130, 30, 0.1) 40%, transparent 65%);
      mix-blend-mode: screen; z-index: 2; pointer-events: none;
      transition: opacity var(--transition-time) ease;
    }
    body.light-mode .table-glow { opacity: 0; }

    .vignette-dark, .vignette-light {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 30;
      transition: opacity var(--transition-time) ease;
    }
    .vignette-dark {
      background: radial-gradient(circle at 50% 45%, transparent 10%, rgba(0,0,0,0.98) 100%);
    }
    .vignette-light {
      background: radial-gradient(circle at 50% 45%, transparent 10%, rgba(0,0,0,0.6) 100%);
      opacity: 0;
    }
    body.light-mode .vignette-dark { opacity: 0; }
    body.light-mode .vignette-light { opacity: 1; }

    #dust-canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none; z-index: 10;
      transition: opacity var(--transition-time) ease;
    }
    body.light-mode #dust-canvas { opacity: 0; }

    /* Lamp Container */
    .lamp-container {
      position: absolute; bottom: 18vh; left: 50%; transform: translateX(-50%);
      width: 320px; height: 600px;
      z-index: 20; cursor: pointer; -webkit-tap-highlight-color: transparent;
    }

    .base-shadow {
      position: absolute; bottom: -8px; left: 50%; margin-left: -75px;
      width: 150px; height: 16px; border-radius: 50%;
      background: rgba(0,0,0,1); filter: blur(5px);
      z-index: 0; transition: opacity var(--transition-time) ease;
    }
    body.light-mode .base-shadow { background: rgba(0,0,0,0.7); }

    /* High-end Photorealistic Brass Base */
    .lamp-base {
      position: absolute; bottom: 0; left: 50%; margin-left: -65px;
      width: 130px; height: 22px; border-radius: 8px;
      z-index: 1;
      background: linear-gradient(to right, #241800 0%, #735100 15%, #ffdb4d 30%, #fff7cc 45%, #e6a800 65%, #8a6200 85%, #241800 100%);
      box-shadow: inset 0 2px 3px rgba(255,255,255,0.7), inset 0 -4px 8px rgba(0,0,0,0.8), 0 6px 12px rgba(0,0,0,0.9);
      transition: filter var(--transition-time) ease;
    }
    body.light-mode .lamp-base { filter: brightness(0.4); }

    /* Base Ridge (adds physical detailing) */
    .lamp-base::after {
      content: ''; position: absolute; bottom: 100%; left: 50%; margin-left: -50px;
      width: 100px; height: 6px; border-radius: 4px 4px 0 0;
      background: linear-gradient(to right, #1a1100, #d9a01a, #fff2b3, #b38200, #1a1100);
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.9);
    }

    /* Machined Brass Stem Collar (replaces the cartoon rings) */
    .stem-collar {
      position: absolute; bottom: 28px; left: 50%; margin-left: -12px;
      width: 24px; height: 80px; border-radius: 3px; z-index: 2;
      background: linear-gradient(to right, #1f1400 0%, #b38200 25%, #ffeba8 50%, #996e00 75%, #1f1400 100%);
      /* Machined grooves */
      background-image: repeating-linear-gradient(to bottom, transparent, transparent 3px, rgba(0,0,0,0.5) 3px, rgba(0,0,0,0.5) 5px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.7);
      transition: filter var(--transition-time) ease;
    }
    body.light-mode .stem-collar { filter: brightness(0.4); }

    /* Thin Gold Stem */
    .lamp-stem {
      position: absolute; bottom: 28px; left: 50%; margin-left: -4px;
      width: 8px; height: 380px; z-index: 1;
      background: linear-gradient(to right, #1a1100 0%, #b38200 20%, #fff7cc 45%, #996e00 75%, #1a1100 100%);
      transition: filter var(--transition-time) ease;
    }
    body.light-mode .lamp-stem { filter: brightness(0.4); }

    /* Soft Photorealistic Light Cone */
    .light-cone {
      position: absolute; top: 180px; left: 50%; margin-left: -350px;
      width: 700px; height: 420px;
      background: linear-gradient(to bottom, rgba(255, 220, 100, 0.45) 0%, rgba(255, 170, 30, 0.05) 80%, transparent 100%);
      
      /* Soft conic mask instead of hard clip-path for realistic light falloff */
      -webkit-mask-image: conic-gradient(from 120deg at 50% -10%, transparent 0deg, rgba(0,0,0,0.2) 15deg, rgba(0,0,0,1) 35deg, rgba(0,0,0,1) 85deg, rgba(0,0,0,0.2) 105deg, transparent 120deg);
      mask-image: conic-gradient(from 120deg at 50% -10%, transparent 0deg, rgba(0,0,0,0.2) 15deg, rgba(0,0,0,1) 35deg, rgba(0,0,0,1) 85deg, rgba(0,0,0,0.2) 105deg, transparent 120deg);
      
      z-index: 5; pointer-events: none; mix-blend-mode: screen;
      transition: opacity var(--transition-time) ease;
    }
    body.light-mode .light-cone { opacity: 0; }

    /* Ambient Core Glow */
    .core-glow {
      position: absolute; top: 185px; left: 50%; margin-left: -80px;
      width: 160px; height: 40px; border-radius: 50%;
      background: #ffeba8; filter: blur(20px);
      z-index: 6; pointer-events: none; mix-blend-mode: screen;
      transition: opacity var(--transition-time) ease;
    }
    body.light-mode .core-glow { opacity: 0; }

    /* Realistic Fabric Lamp Shade */
    .lamp-shade {
      position: absolute; top: 10px; left: 50%; margin-left: -130px;
      width: 260px; height: 185px; z-index: 10;
      clip-path: polygon(25% 0%, 75% 0%, 100% 100%, 0% 100%);
      
      /* Base fabric gradient with dramatic physical curve shading */
      background: linear-gradient(to right, #0d0c0a 0%, #2b2823 40%, #3d3932 60%, #171512 100%);
      transition: filter var(--transition-time) ease;
    }
    /* Inner light spill onto the fabric */
    .lamp-shade::before {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 100%, rgba(255, 200, 80, 0.4) 0%, transparent 70%);
      transition: opacity var(--transition-time) ease;
    }
    /* SVG Noise layer for fabric weave texture */
    .lamp-shade::after {
      content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background-image: url('data:image/svg+xml;utf8,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.6" numOctaves="4" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
      opacity: 0.15; mix-blend-mode: multiply; pointer-events: none;
    }
    body.light-mode .lamp-shade { filter: brightness(0.3); }
    body.light-mode .lamp-shade::before { opacity: 0; }

    /* Glowing Bottom Rim */
    .shade-rim {
      position: absolute; top: 193px; left: 50%; margin-left: -130px;
      width: 260px; height: 3px; z-index: 11;
      background: #fffbe6;
      box-shadow: 0 1px 4px #ffe16b, 0 4px 15px #ffaa00;
      transition: opacity var(--transition-time) ease;
    }
    body.light-mode .shade-rim { opacity: 0; }

    /* Refined Pull Chain */
    .pull-chain {
      position: absolute; top: 195px; left: 50%; margin-left: -1px; width: 2px; height: 90px;
      z-index: 4; transform-origin: top center;
    }
    .pull-chain::before {
      content:''; position:absolute; top:0; left:0; width:100%; height:100%;
      background: repeating-linear-gradient(to bottom, #d4af37, #d4af37 2px, #6e5c1e 2px, #6e5c1e 4px); transition: opacity var(--transition-time) ease;
    }
    .pull-chain::after {
      content:''; position:absolute; top:0; left:0; width:100%; height:100%;
      background: repeating-linear-gradient(to bottom, #555, #555 2px, #333 2px, #333 4px); opacity: 0; transition: opacity var(--transition-time) ease;
    }
    body.light-mode .pull-chain::before { opacity: 0; }
    body.light-mode .pull-chain::after { opacity: 1; }

    .pull-chain-handle {
      position: absolute; bottom: -15px; left: -3px; width: 8px; height: 20px; border-radius: 4px;
      box-shadow: 0 3px 6px rgba(0,0,0,0.5);
    }
    .pull-chain-handle::before {
      content:''; position:absolute; top:0; left:0; width:100%; height:100%; border-radius: inherit; background: linear-gradient(to right, #d4af37, #ffea75, #d4af37); transition: opacity var(--transition-time) ease;
    }
    .pull-chain-handle::after {
      content:''; position:absolute; top:0; left:0; width:100%; height:100%; border-radius: inherit; background: linear-gradient(to right, #666, #999, #666); opacity: 0; transition: opacity var(--transition-time) ease;
    }
    body.light-mode .pull-chain-handle::before { opacity: 0; }
    body.light-mode .pull-chain-handle::after { opacity: 1; }

    /* Flicker Animation */
    @keyframes flickerAnim {
      0% { opacity: 0.1; }
      10% { opacity: 1; }
      20% { opacity: 0.2; }
      30% { opacity: 1; }
      45% { opacity: 0.5; }
      60% { opacity: 1; }
      80% { opacity: 0.8; }
      100% { opacity: 1; }
    }
    .flicker-active .table-glow,
    .flicker-active .wall-glow,
    .flicker-active .shade-rim,
    .flicker-active .core-glow,
    .flicker-active .light-cone {
      animation: flickerAnim 0.35s ease-out forwards;
    }

  </style>
</head>
<body>

  <div class="wall-texture"></div>
  <div class="vignette-dark"></div>
  <div class="vignette-light"></div>
  <div class="grain-overlay"></div>
  <canvas id="dust-canvas"></canvas>

  <div class="wall-glow"></div>
  <div class="table-surface"></div>
  <div class="table-glow"></div>
  
  <div class="lamp-container" id="lamp-container">
    <div class="base-shadow"></div>
    <div class="lamp-base"></div>
    <div class="stem-collar"></div>
    <div class="lamp-stem"></div>
    
    <div class="light-cone"></div>
    <div class="core-glow"></div>
    
    <div class="lamp-shade"></div>
    <div class="shade-rim"></div>
    
    <div class="pull-chain" id="pull-chain">
      <div class="pull-chain-handle"></div>
    </div>
  </div>

  <script>
    // Audio Context Setup
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    let humOsc, humGain;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playClickSound() {
      initAudio();
      const t = audioCtx.currentTime;
      
      function snap(time) {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        
        osc.type = 'square';
        osc.frequency.setValueAtTime(500, time);
        osc.frequency.exponentialRampToValueAtTime(100, time + 0.04);
        
        filter.type = 'highpass';
        filter.frequency.value = 800;
        
        gain.gain.setValueAtTime(0.3, time);
        gain.gain.exponentialRampToValueAtTime(0.01, time + 0.04);
        
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        
        osc.start(time);
        osc.stop(time + 0.04);
      }
      
      snap(t);
      snap(t + 0.1); 
    }

    function toggleHum(isDark) {
      initAudio();
      if (isDark) {
        humOsc = audioCtx.createOscillator();
        humGain = audioCtx.createGain();
        humOsc.type = 'sawtooth';
        humOsc.frequency.value = 60;
        
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'lowpass';
        filter.frequency.value = 150;
        
        humGain.gain.setValueAtTime(0, audioCtx.currentTime);
        humGain.gain.linearRampToValueAtTime(0.015, audioCtx.currentTime + 1);
        
        humOsc.connect(filter);
        filter.connect(humGain);
        humGain.connect(audioCtx.destination);
        humOsc.start();
      } else {
        if (humGain) {
          humGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.3);
          setTimeout(() => { if (humOsc) humOsc.stop(); }, 350);
        }
      }
    }

    // Canvas Dust & Fireflies
    const canvas = document.getElementById('dust-canvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    let fireflies = [];
    const particleCount = 70;

    let targetMouseX = window.innerWidth / 2;
    let targetMouseY = window.innerHeight / 2;
    document.addEventListener('mousemove', (e) => {
      targetMouseX = e.clientX;
      targetMouseY = e.clientY;
    });

    function initParticles() {
      particles = [];
      for (let i = 0; i < particleCount; i++) {
        particles.push({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          radius: Math.random() * 1.5 + 0.3,
          vx: (Math.random() - 0.5) * 0.2,
          vy: (Math.random() - 0.5) * 0.2,
          baseOpacity: Math.random() * 0.6 + 0.1,
          currentOpacity: Math.random() * 0.6
        });
      }
      fireflies = [];
      for (let i = 0; i < 4; i++) {
        fireflies.push({
          x: window.innerWidth / 2 + (Math.random() - 0.5) * 150,
          y: window.innerHeight * 0.4 + (Math.random() - 0.5) * 150,
          vx: 0, vy: 0, angle: Math.random() * Math.PI * 2
        });
      }
    }

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      initParticles();
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawDust() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const isDark = !document.body.classList.contains('light-mode');
      
      particles.forEach(p => {
        const dx = targetMouseX - p.x;
        const dy = targetMouseY - p.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        if (dist < 120) {
          const force = (120 - dist) / 120;
          p.vx -= (dx / dist) * force * 0.1;
          p.vy -= (dy / dist) * force * 0.1;
        }

        p.x += p.vx;
        p.y += p.vy - 0.15;
        p.vx *= 0.99;
        
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;
        
        p.currentOpacity += (Math.random() - 0.5) * 0.04;
        p.currentOpacity = Math.max(0, Math.min(p.baseOpacity, p.currentOpacity));
        
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        // Golden dust
        ctx.fillStyle = `rgba(255, 200, 100, ${p.currentOpacity})`;
        ctx.fill();
      });

      if (isDark) {
        const lampX = window.innerWidth / 2;
        const lampY = window.innerHeight * 0.45;
        
        fireflies.forEach(f => {
          const dx = lampX - f.x;
          const dy = lampY - f.y;
          
          f.vx += dx * 0.0001;
          f.vy += dy * 0.0001;
          
          f.angle += (Math.random() - 0.5) * 0.6;
          f.vx += Math.cos(f.angle) * 0.2;
          f.vy += Math.sin(f.angle) * 0.2;
          
          f.vx *= 0.95;
          f.vy *= 0.95;
          f.x += f.vx;
          f.y += f.vy;
          
          const glowIntensity = Math.random() * 0.5 + 0.5;
          ctx.beginPath();
          ctx.arc(f.x, f.y, 1.5, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 240, 150, ${glowIntensity})`;
          ctx.fill();
          
          ctx.beginPath();
          ctx.arc(f.x, f.y, 6, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 150, 0, ${glowIntensity * 0.25})`;
          ctx.fill();
        });
      }
    }

    // Parallax and Physics for the Pull Chain
    const lampContainer = document.getElementById('lamp-container');
    const pullChain = document.getElementById('pull-chain');

    let angle = 0;
    let angularVelocity = 0;
    let angularAcceleration = 0;
    let time = 0;
    const gravity = 0.4;
    const length = 80;
    const damping = 0.98;

    function animate() {
      time += 0.016;
      
      const breezeTarget = (Math.sin(time * 0.8) * Math.sin(time * 1.3 + 1)) * 0.04;
      angularAcceleration = (-gravity / length) * Math.sin(angle - breezeTarget);
      
      angularVelocity += angularAcceleration;
      angularVelocity *= damping;
      angle += angularVelocity;
      
      pullChain.style.transform = `rotate(${angle * (180 / Math.PI)}deg)`;
      
      drawDust();
      requestAnimationFrame(animate);
    }

    lampContainer.addEventListener('click', () => {
      const isLight = document.body.classList.toggle('light-mode');
      
      playClickSound();
      
      if (!isLight) {
        document.body.classList.remove('flicker-active');
        void document.body.offsetWidth;
        document.body.classList.add('flicker-active');
        toggleHum(true);
      } else {
        document.body.classList.remove('flicker-active');
        toggleHum(false);
      }

      const impulse = (Math.random() > 0.5 ? 1 : -1) * 0.05;
      angularVelocity += impulse;
      if (angularVelocity > 0.2) angularVelocity = 0.2;
      if (angularVelocity < -0.2) angularVelocity = -0.2;
    });

    angularVelocity = 0.02;
    animate();
    
    document.addEventListener('click', () => {
      if (!document.body.classList.contains('light-mode') && !humOsc) {
        toggleHum(true);
      }
    }, { once: true });
  </script>
</body>
</html>
